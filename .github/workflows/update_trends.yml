name: Auto Update Google Trends & News Data

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install pytrends pandas requests beautifulsoup4 feedparser

      - name: Run Trends & News Scrapers
        run: |
          python Dashboard/trends_scraper.py
          python Dashboard/news_scraper.py

      - name: Commit and push updated data
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add Dashboard/google_trends_latest.json Dashboard/wordfreq_latest.json Dashboard/news_data/
          git commit -m 'Auto update Google Trends and News data [skip ci]' || echo 'No changes to commit'
          git push