name: Auto Update Google Trends Data

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

jobs:
  update-trends:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install pytrends pandas requests

      - name: Run Trends Scraper
        run: |
          python Dashboard/trends_scraper.py

      - name: Commit and push updated trends data
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add Dashboard/google_trends_latest.json Dashboard/news_data/google_trends_latest.json
          git commit -m 'Auto update Google Trends data [skip ci]' || echo 'No changes to commit'
          git push